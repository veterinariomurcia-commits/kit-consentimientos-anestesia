# Robot de publicación (tarea T12).
# Cada vez que se suben cambios a la rama main, GitHub fabrica la web (npm run build)
# y la publica en GitHub Pages. También se puede lanzar a mano desde la pestaña Actions.

name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo los permisos justos para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se suben dos cambios seguidos, se publica el último sin cortar una publicación a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fabricar:
    name: Fabricar la web
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar las piezas (versiones exactas de package-lock.json)
        run: npm ci

      - name: Fabricar la web en dist/
        run: npm run build

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Entregar dist/ a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar en GitHub Pages
    needs: fabricar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Publicar
        id: publicacion
        uses: actions/deploy-pages@v4
